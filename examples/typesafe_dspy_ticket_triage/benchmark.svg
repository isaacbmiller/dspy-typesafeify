<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Typesafe decorator cost and latency comparison</title>
  <desc id="desc">Across three observed tickets, average modeled cost fell from 0.000377 dollars to 0.000263 dollars per ticket, a 30.1 percent reduction. Average latency fell from 2.329 seconds to 1.958 seconds, a 15.9 percent reduction. The decorated latency comprises 0.205 seconds of Typesafe evaluation and 1.751 seconds of language-model work.</desc>

  <rect width="1200" height="470" fill="#fbfaf7"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#171717">
    <text x="64" y="64" font-size="28" font-weight="600"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@typesafeify</tspan>: cost and latency</text>
    <text x="64" y="94" font-size="15" fill="#55524d">3 observed tickets · averages per ticket</text>

    <line x1="64" y1="128" x2="1136" y2="128" stroke="#cbc7bf" stroke-width="1"/>
    <line x1="590" y1="164" x2="590" y2="404" stroke="#cbc7bf" stroke-width="1"/>

    <text x="64" y="177" font-size="20" font-weight="600">Modeled cost</text>
    <text x="64" y="202" font-size="13" fill="#66625c">USD per ticket · all priced token categories</text>

    <text x="64" y="258" font-size="15">Before</text>
    <rect x="146" y="235" width="154" height="32" fill="#77736c"/>
    <rect x="300" y="235" width="176" height="32" fill="#343330"/>
    <text x="488" y="257" font-size="16" font-weight="600">$0.000377</text>

    <text x="64" y="321" font-size="15">After</text>
    <rect x="146" y="298" width="51.4" height="32" fill="#47866f"/>
    <rect x="197.4" y="298" width="137.2" height="32" fill="#77736c"/>
    <rect x="334.6" y="298" width="42.1" height="32" fill="#343330"/>
    <text x="389" y="320" font-size="16" font-weight="600">$0.000263</text>

    <rect x="146" y="352" width="11" height="11" fill="#47866f"/>
    <text x="164" y="362" font-size="12" fill="#55524d">Typesafe input</text>
    <rect x="260" y="352" width="11" height="11" fill="#77736c"/>
    <text x="278" y="362" font-size="12" fill="#55524d">Luna input</text>
    <rect x="354" y="352" width="11" height="11" fill="#343330"/>
    <text x="372" y="362" font-size="12" fill="#55524d">Luna output + reasoning</text>

    <text x="146" y="402" font-size="27" font-weight="600" fill="#27664f">30.1% lower</text>

    <text x="638" y="177" font-size="20" font-weight="600">Observed latency</text>
    <text x="638" y="202" font-size="13" fill="#66625c">Wall-clock seconds per ticket</text>

    <text x="638" y="258" font-size="15">Before</text>
    <rect x="720" y="235" width="330" height="32" fill="#7699c2"/>
    <text x="1062" y="257" font-size="16" font-weight="600">2.329 s</text>

    <text x="638" y="321" font-size="15">After</text>
    <rect x="720" y="298" width="29.0" height="32" fill="#47866f"/>
    <rect x="749" y="298" width="248.2" height="32" fill="#7699c2"/>
    <text x="1009" y="320" font-size="16" font-weight="600">1.958 s</text>

    <rect x="720" y="352" width="11" height="11" fill="#47866f"/>
    <text x="738" y="362" font-size="12" fill="#55524d">Typesafe 0.205 s</text>
    <rect x="873" y="352" width="11" height="11" fill="#7699c2"/>
    <text x="891" y="362" font-size="12" fill="#55524d">LLM 1.751 s</text>

    <text x="720" y="402" font-size="27" font-weight="600" fill="#27664f">15.9% faster</text>
  </g>
</svg>
